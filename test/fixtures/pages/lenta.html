<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Salida lenta</title>
    <script>
      // Como una página que guarda su estado al salir: la petición de la navegación sale ~400 ms tarde.
      addEventListener("beforeunload", () => {
        const start = performance.now();
        while (performance.now() - start < 400);
      });
    </script>
  </head>
  <body>
    <form action="/welcome" method="get">
      <label>Nombre <input name="nombre" value="Ana" /></label>
      <button type="submit">Continuar</button>
    </form>
  </body>
</html>
