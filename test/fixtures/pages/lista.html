<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Lista larga</title>
  </head>
  <body>
    <h1>Catálogo</h1>
    <ul id="lista"></ul>
    <button id="final">Último botón</button>
    <script>
      for (let i = 1; i <= 3000; i++) {
        const li = document.createElement("li");
        li.innerHTML = `<a href="/p/${i}">Producto número ${i}</a>`;
        lista.append(li);
      }
    </script>
  </body>
</html>
