<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Iniciar sesión</title>
  </head>
  <body>
    <h1>Bienvenido</h1>
    <form action="/welcome" method="get">
      <label>Correo <input name="email" type="email" /></label>
      <label>Contraseña <input name="pass" type="password" value="secreto-precargado" /></label>

    <a href="/reset">¿Olvidaste tu contraseña?</a>
    <div style="display: none"><button>Botón oculto</button></div>
  </body>
</html>
